        <div class="logo">

<!-- APPOINTMENT SECTION -->
<section class="appointment-section">

    <div class="appointment-container">

        <h1>Book Your Appointment</h1>
        <p>Fill in the form below to schedule your dental visit</p>

        
        <form id="appointmentForm" > 

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+250..." required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label>Select Service</label>
                <select required>
                    <option value="">-- Choose Service --</option>
                    <option>Dental Cleaning</option>
                    <option>Teeth Whitening</option>
                    <option>Tooth Extraction</option>
                    <option>Root Canal Treatment</option>
                    <option>Dental Filling</option>
                    <option>Emergency Care</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Date</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Preferred Time</label>
                <select required>
                    <option value="">-- Select Time --</option>
                    <option>08:00 AM</option>
                    <option>10:00 AM</option>
                    <option>12:00 PM</option>
                    <option>02:00 PM</option>
                    <option>04:00 PM</option>
                </select>
            </div>

            <div class="form-group">
                <label>Message / Reason</label>
                <textarea rows="4" placeholder="Describe your dental issue..."></textarea>
            </div>

            <button type="submit" class="btn">
                Book Appointment
            </button>

        </form>

    </div>

</section>

</body>
