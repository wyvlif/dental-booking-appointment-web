<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DentalCare Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-tooth"></i> DentalCare Pro</div>
        <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <ul id="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<section class="login-section">
    <div class="login-box">
        <h2>Register</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <div class="form-options">
                <input type="checkbox" id="remember">
                <label> Remember Me</label>
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="regBtn">Create Account</button>
        </form>

        <hr> <!-- Uses the CSS provided in previous response -->
        
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleGoogleRegister">
        </div>
        <div class="g_id_signin" data-type="standard"></div>

        <p id="msg"></p>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</section>

<script>
// 1. Mobile Menu
document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('nav-list').classList.toggle('show');
});

// 2. Registration Logic
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("regBtn");
    
    msg.innerText = "Processing...";
    btn.disabled = true;

    fetch("backend/register.php", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            remember: document.getElementById("remember").checked
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            msg.style.color = "green";
            msg.innerText = "Registration successful! Redirecting...";
            setTimeout(() => window.location.href = "login.html", 2000);
        } else {
            msg.style.color = "red";
            msg.innerText = data.message || "Error registering user";
            btn.disabled = false;
        }
    })
    .catch(() => {
        msg.innerText = "Server error. Try again later.";
        btn.disabled = false;
    });
});

// 3. Google Registration Handler
function handleGoogleRegister(response) {
    fetch("backend/google-login.php", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ token: response.credential, action: 'register' })
    })
    .then(res => res.json())
    .then(data => window.location.href = "patient-dashboard.html");
}
</script>
</body>
</html>
